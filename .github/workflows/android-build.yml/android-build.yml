
name: SXORPION Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract launcher source
        run: |
          unzip -q SXORPION-Launcher-Engineering-Source-0.9.0.zip -d extracted
          test -f extracted/SXORPION-Launcher-Engineering-Source/settings.gradle.kts

      - name: Run unit tests
        working-directory: extracted/SXORPION-Launcher-Engineering-Source
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: extracted/SXORPION-Launcher-Engineering-Source
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SXORPION-Launcher-Debug-APK
          path: extracted/SXORPION-Launcher-Engineering-Source/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          
